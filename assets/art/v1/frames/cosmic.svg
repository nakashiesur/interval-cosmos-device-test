<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 190 190" fill="none" stroke-width="3"><style>@keyframes spin{to{transform:rotate(360deg)}}.spin{transform-origin:90px 90px;animation:spin 18s linear infinite}.reverse{animation-direction:reverse;animation-duration:24s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle cx="90" cy="90" r="76" fill="none" stroke="#64deef" /><g class="spin"><circle cx="90" cy="14" r="4" fill="#a9f5ff" stroke="none" transform="rotate(0 90 90)"/><circle cx="90" cy="14" r="4" fill="#a9f5ff" stroke="none" transform="rotate(120 90 90)"/><circle cx="90" cy="14" r="4" fill="#a9f5ff" stroke="none" transform="rotate(240 90 90)"/></g></svg>