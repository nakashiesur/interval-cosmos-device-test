<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 190 190" fill="none" stroke-width="3"><style>@keyframes spin{to{transform:rotate(360deg)}}.nova-turn,.nova-rays,.nova-wave,.horizon-turn,.horizon-inner{transform-origin:90px 90px}.nova-turn{animation:spin 8s linear infinite}.nova-flare{transform-box:fill-box;transform-origin:center;animation:nova-flare 2.8s ease-in-out infinite}.nova-wave{animation:nova-wave 2.8s ease-out infinite}.nova-rays{animation:spin 12s linear infinite reverse}.horizon-turn{animation:spin 4s linear infinite}.horizon-reverse{animation:orbit-reverse 5.5s linear infinite}.horizon-inner{animation:spin 9s linear infinite reverse}@keyframes nova-flare{0%,100%{transform:scale(.6);opacity:.65}50%{transform:scale(1.35);opacity:1}}@keyframes nova-wave{0%{transform:scale(.98);opacity:.8}100%{transform:scale(1.16);opacity:0}}@keyframes orbit-reverse{from{transform:rotate(70deg)}to{transform:rotate(-290deg)}}@media(prefers-reduced-motion:reduce){.frame *{animation:none!important}}.eh-blades,.eh-counter,.eh-particles{transform-origin:90px 90px}.eh-blades{animation:spin 3.6s linear infinite}.eh-counter{animation:spin 6s linear infinite reverse}.eh-particles{animation:spin 2.4s linear infinite}.eh-disc{animation:eh-energy 3s ease-in-out infinite}.eh-satellite{offset-path:path('M3 90 C24 122 156 122 177 90 C156 58 24 58 3 90');animation:eh-orbit 2s linear infinite}@keyframes eh-orbit{to{offset-distance:100%}}@keyframes eh-energy{0%,100%{opacity:.7}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.frame *{animation:none!important}}</style><circle cx="90" cy="90" r="74" fill="none" stroke="#ffd59a" /><g class="nova-turn"><g transform="rotate(0 90 90)"><g class="nova-flare" style="animation-delay:0s"><path d="M90 2 L92 12 L102 14 L92 16 L90 26 L88 16 L78 14 L88 12Z" fill="#fff3d9" stroke="none"/></g></g><g transform="rotate(90 90 90)"><g class="nova-flare" style="animation-delay:-0.55s"><path d="M90 2 L92 12 L102 14 L92 16 L90 26 L88 16 L78 14 L88 12Z" fill="#ffbe85" stroke="none"/></g></g><g transform="rotate(180 90 90)"><g class="nova-flare" style="animation-delay:-1.1s"><path d="M90 2 L92 12 L102 14 L92 16 L90 26 L88 16 L78 14 L88 12Z" fill="#fff3d9" stroke="none"/></g></g><g transform="rotate(270 90 90)"><g class="nova-flare" style="animation-delay:-1.6500000000000001s"><path d="M90 2 L92 12 L102 14 L92 16 L90 26 L88 16 L78 14 L88 12Z" fill="#ffbe85" stroke="none"/></g></g></g><g class="nova-wave"><circle cx="90" cy="90" r="74" fill="none" stroke="#ffd6a3" /></g><g class="nova-wave" style="animation-delay:-1.4s"><circle cx="90" cy="90" r="74" fill="none" stroke="#9defff" /></g><g class="nova-rays"><path d="M90 9v-6" transform="rotate(0 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(30 90 90)" stroke="#ffc28e" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(60 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(90 90 90)" stroke="#ffc28e" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(120 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(150 90 90)" stroke="#ffc28e" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(180 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(210 90 90)" stroke="#ffc28e" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(240 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(270 90 90)" stroke="#ffc28e" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(300 90 90)" stroke="#fff4df" stroke-linecap="round"/><path d="M90 9v-6" transform="rotate(330 90 90)" stroke="#ffc28e" stroke-linecap="round"/></g></svg>