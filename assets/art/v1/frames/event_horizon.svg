<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 190 190" fill="none" stroke-width="3"><style>@keyframes spin{to{transform:rotate(360deg)}}.nova-turn,.nova-rays,.nova-wave,.horizon-turn,.horizon-inner{transform-origin:90px 90px}.nova-turn{animation:spin 8s linear infinite}.nova-flare{transform-box:fill-box;transform-origin:center;animation:nova-flare 2.8s ease-in-out infinite}.nova-wave{animation:nova-wave 2.8s ease-out infinite}.nova-rays{animation:spin 12s linear infinite reverse}.horizon-turn{animation:spin 4s linear infinite}.horizon-reverse{animation:orbit-reverse 5.5s linear infinite}.horizon-inner{animation:spin 9s linear infinite reverse}@keyframes nova-flare{0%,100%{transform:scale(.6);opacity:.65}50%{transform:scale(1.35);opacity:1}}@keyframes nova-wave{0%{transform:scale(.98);opacity:.8}100%{transform:scale(1.16);opacity:0}}@keyframes orbit-reverse{from{transform:rotate(70deg)}to{transform:rotate(-290deg)}}@media(prefers-reduced-motion:reduce){.frame *{animation:none!important}}.eh-blades,.eh-counter,.eh-particles{transform-origin:90px 90px}.eh-blades{animation:spin 3.6s linear infinite}.eh-counter{animation:spin 6s linear infinite reverse}.eh-particles{animation:spin 2.4s linear infinite}.eh-disc{animation:eh-energy 3s ease-in-out infinite}.eh-satellite{offset-path:path('M3 90 C24 122 156 122 177 90 C156 58 24 58 3 90');animation:eh-orbit 2s linear infinite}@keyframes eh-orbit{to{offset-distance:100%}}@keyframes eh-energy{0%,100%{opacity:.7}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.frame *{animation:none!important}}</style><circle cx="90" cy="90" r="72" fill="none" stroke="#352c61" /><circle cx="90" cy="90" r="76" fill="none" stroke="#8064cb" stroke-width="1"/><g class="eh-blades"><g transform="rotate(0 90 90)"><path d="M90 6 A84 84 0 0 1 171 68 L166 55 A79 79 0 0 0 90 11 Z" fill="#76f1ff" stroke="none"/><path d="M99 7 A84 84 0 0 1 160 42" fill="none" stroke="#edfcff" stroke-width="1.4"/></g><g transform="rotate(120 90 90)"><path d="M90 6 A84 84 0 0 1 171 68 L166 55 A79 79 0 0 0 90 11 Z" fill="#c0a0ff" stroke="none"/><path d="M99 7 A84 84 0 0 1 160 42" fill="none" stroke="#edfcff" stroke-width="1.4"/></g><g transform="rotate(240 90 90)"><path d="M90 6 A84 84 0 0 1 171 68 L166 55 A79 79 0 0 0 90 11 Z" fill="#76f1ff" stroke="none"/><path d="M99 7 A84 84 0 0 1 160 42" fill="none" stroke="#edfcff" stroke-width="1.4"/></g></g><g class="eh-counter"><circle cx="90" cy="90" r="79" fill="none" stroke="#b995ff" stroke-dasharray="65 100 12 70" stroke-width="2"/></g><g class="eh-particles"><g transform="rotate(0 90 90)"><path d="M90 1 A89 89 0 0 1 139 16" fill="none" stroke="#74eeff" stroke-width="1" opacity=".6"/><circle cx="90" cy="1" r="2.5" fill="#edffff" stroke="none"/></g><g transform="rotate(155 90 90)"><path d="M90 1 A89 89 0 0 1 139 16" fill="none" stroke="#b991ff" stroke-width="1" opacity=".6"/><circle cx="90" cy="1" r="2.5" fill="#edffff" stroke="none"/></g><g transform="rotate(250 90 90)"><path d="M90 1 A89 89 0 0 1 139 16" fill="none" stroke="#74eeff" stroke-width="1" opacity=".6"/><circle cx="90" cy="1" r="2.5" fill="#edffff" stroke="none"/></g></g><g transform="rotate(-24 90 90)"><g class="eh-disc"><path d="M3 90 C24 122 156 122 177 90" fill="none" stroke="#7655be" stroke-width="6"/><path d="M3 90 C24 122 156 122 177 90" fill="none" stroke="#bfa7ff" stroke-width="2.2"/><path d="M4 90 C30 114 150 114 176 90" fill="none" stroke="#e0fbff" stroke-width="1.2"/><path d="M3 90 C24 58 156 58 177 90" fill="none" stroke="#73d9f0" stroke-width="1" opacity=".4"/><circle class="eh-satellite" r="3" fill="#f1ffff" stroke="none"/></g></g></svg>