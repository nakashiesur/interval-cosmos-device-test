<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 190 190" fill="none" stroke-width="3"><style>@keyframes spin{to{transform:rotate(360deg)}}.spin{transform-origin:90px 90px;animation:spin 18s linear infinite}.reverse{animation-direction:reverse;animation-duration:24s}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="spin"><circle cx="90" cy="90" r="77" fill="none" stroke="#70e6f3" stroke-dasharray="90 31"/></g><g class="spin reverse"><circle cx="90" cy="90" r="82" fill="none" stroke="#c3adfc" stroke-dasharray="55 74"/></g></svg>